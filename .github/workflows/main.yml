# This is a basic workflow to help you get started with Actions

name: Build

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  buildLinux:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.2.5
      # Runs a set of commands using the runners shell
      - name: Install Haxelib
        run: |
          sudo apt-get install libvlc-dev
          sudo apt-get install libvlccore-dev
          haxelib setup ~/haxelib
          haxelib install hxcpp > /dev/null
          haxelib install lime
          haxelib set lime 8.1.2
          haxelib set openfl 9.3.2
          haxelib --never install flixel 5.5.0
          haxelib run lime setup flixel
          haxelib run lime setup
          haxelib set flixel-tools 1.5.1
          haxelib set flixel-ui 2.5.0
          haxelib set flixel-addons 3.2.1
          haxelib set flixel-demos 3.2.1
          haxelib set flixel-templates 2.7.0
          haxelib set tjson 1.4.0
          haxelib git hxCodec https://github.com/polybiusproxy/hxCodec
          haxelib set hxCodec git
          haxelib set hscript 2.5.0
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc
          haxelib git hxcpp https://github.com/HaxeFoundation/hxcpp/
          haxelib set hxcpp git
          haxelib set hxvlc 1.8.0
          haxelib set extension-androidtools 2.1.1
          haxelib set actuate 1.9.0
          haxelib set hxcpp-debug-server 1.2.4
          haxelib set box2d 1.2.3
          haxelib set BrewScript 6.1.80
          haxelib set jsonpatch 1.0.0
          haxelib set jsonpath 1.0.0
          haxelib set layout 1.2.1
          haxelib set lime-samples 7.0.0
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit
          haxelib set linc_luajit git
          haxelib set newgrounds 2.0.3
          haxelib set openfl-samples 8.7.0
          haxelib set SScript 7.7.0
          haxelib set systools 1.1.0
          haxelib set thx.core 0.44.0
          haxelib set thx.semver 0.2.2
          haxelib git polymod https://github.com/larsiusprime/polymod
          haxelib set polymod git
          haxelib git flxanimate https://github.com/Dot-Stuff/flxanimate/
          haxelib set flxanimate git
          haxelib set hscript-iris 1.1.3
          haxelib git fnf-modcharting-tools https://github.com/EdwhakKB/FNF-Modcharting-Tools
          haxelib list
      - name: Create Version Tag
        run: echo "${{github.run_id}}" > VERSION
      - name: Compile
        run: haxelib run lime build Project.xml linux --app-version="4.0.0-${{ github.run_id}}"
      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linuxBuild
          path: 'export/release/linux/bin'
